<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 小助手图标设计方案预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 40px;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 48px; font-size: 14px; }
  .designs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .design-card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 20px;
    padding: 40px 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: border-color 0.3s;
  }
  .design-card:hover {
    border-color: rgba(129, 140, 248, 0.4);
  }
  .design-card h3 {
    font-size: 16px;
    font-weight: 700;
    color: #e2e8f0;
  }
  .design-card .desc {
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
    line-height: 1.5;
    min-height: 36px;
  }
  .fab-preview {
    position: relative;
  }

  /* ========== FAB Base ========== */
  .fab {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  }
  .fab:hover { transform: scale(1.1); }

  /* ========== Option 1: Pulse Ring + Sparkle Bot ========== */
  .fab-1 {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
  }
  .fab-1:hover { box-shadow: 0 12px 44px rgba(99, 102, 241, 0.5); }
  .fab-1 .pulse-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(129, 140, 248, 0.4);
    animation: pulse-ring 2s ease-out infinite;
  }
  .fab-1 .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
  .fab-1 .pulse-ring:nth-child(3) { animation-delay: 1.2s; }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  /* ========== Option 2: Glassmorphism + Magic Wand ========== */
  .fab-2 {
    background: rgba(139, 92, 246, 0.18);
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(139, 92, 246, 0.35);
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .fab-2 svg { filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.6)); }

  /* ========== Option 3: Dark Gem + AI Spark ========== */
  .fab-3 {
    background: linear-gradient(145deg, #1e1b4b, #312e81, #3730a3);
    box-shadow:
      0 0 0 2px rgba(99, 102, 241, 0.3),
      0 8px 32px rgba(99, 102, 241, 0.25),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .fab-3:hover { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5), 0 12px 44px rgba(99, 102, 241, 0.35); }
  .fab-3 .inner-glow {
    position: absolute;
    width: 18px; height: 18px;
    top: 10px; right: 14px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.5), transparent);
    border-radius: 50%;
    filter: blur(6px);
  }

  /* ========== Option 4: Liquid Metal + Aurora ========== */
  .fab-4 {
    background: linear-gradient(135deg, #0c1929 0%, #1a2740 40%, #1e1e3f 70%, #1a1040 100%);
    border: 1px solid rgba(99, 135, 241, 0.25);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.4),
      0 8px 36px rgba(79, 125, 249, 0.15),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .fab-4::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f7df9, #8b5cf6, #4f7df9);
    z-index: -1;
    opacity: 0.5;
    animation: rotate-border 4s linear infinite;
    mask: radial-gradient(circle, transparent 55%, black 55%);
  }
  @keyframes rotate-border {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .fab-4:hover::before { opacity: 0.8; }

  /* ========== Icons ========== */
  .fab svg {
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>

<h1>AI 小助手 — 图标设计方案</h1>
<p class="subtitle">定位: 右下角悬浮按钮 · 52–56px 圆形 · AI 智能助手入口</p>

<div class="designs">

  <!-- Option 1: Pulse Ring + Sparkle Chatbot -->
  <div class="design-card">
    <div class="fab-preview">
      <button class="fab fab-1">
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Chat bubble body -->
          <path d="M21 14a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v9z" />
          <!-- Sparkle top-right -->
          <path d="M18 3l.5 1.5L20 5l-1.5.5L18 7l-.5-1.5L16 5l1.5-.5z" fill="rgba(253,224,71,0.8)" stroke="none" />
          <!-- Inner dots -->
          <circle cx="9" cy="10" r="0.8" fill="#fff" stroke="none" opacity="0.6"/>
          <circle cx="11.5" cy="10" r="0.8" fill="#fff" stroke="none" opacity="0.6"/>
          <circle cx="14" cy="10" r="0.8" fill="#fff" stroke="none" opacity="0.6"/>
        </svg>
      </button>
    </div>
    <h3>方案一 · 脉冲星环</h3>
    <p class="desc">聊天气泡 + 星芒点缀 + 三层呼吸光环<br>科技感强，动态吸睛，不干扰</p>
  </div>

  <!-- Option 2: Glassmorphism + Magic Wand -->
  <div class="design-card">
    <div class="fab-preview">
      <button class="fab fab-2">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Magic wand -->
          <path d="M15 4V2m0 2l-3 3m3-3l3 3" stroke-width="1.2" />
          <!-- Wand body -->
          <path d="M3 21l9-9" />
          <path d="M6.5 3.5l-2 15" transform="rotate(-45 12 12)" stroke-width="0" />
          <!-- Stars -->
          <path d="M18 2l.8 2.2L21 5l-2.2.8L18 8l-.8-2.2L15 5l2.2-.8z" fill="rgba(253,224,71,0.9)" stroke="none"/>
          <circle cx="6" cy="18" r="1" fill="rgba(253,224,71,0.7)" stroke="none"/>
          <circle cx="3" cy="21" r="0.6" fill="rgba(253,224,71,0.5)" stroke="none"/>
        </svg>
      </button>
    </div>
    <h3>方案二 · 琉璃魔杖</h3>
    <p class="desc">魔法棒 + 星光粒子 + 毛玻璃质感<br>精致优雅，AI魔法感，轻奢路线</p>
  </div>

  <!-- Option 3: Dark Gem + Diamond Spark -->
  <div class="design-card">
    <div class="fab-preview">
      <button class="fab fab-3">
        <div class="inner-glow"></div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Diamond shape -->
          <path d="M12 2l4 7-4 5-4-5z" />
          <path d="M12 2l4 7H8l4-7z" fill="rgba(165,180,252,0.15)" stroke="none"/>
          <!-- Star burst top -->
          <path d="M11 1l.3 1L12 2.5l.7-.5.3-1" fill="rgba(253,224,71,0.9)" stroke="none"/>
          <!-- Inner circuit -->
          <path d="M10 9h4M10 11h3" stroke-width="1" opacity="0.5"/>
        </svg>
      </button>
    </div>
    <h3>方案三 · 暗夜晶钻</h3>
    <p class="desc">钻石体 + 星光闪烁 + 深靛渐变<br>沉稳高级，商务感强，暗夜发光</p>
  </div>

  <!-- Option 4: Liquid Metal + Aurora Ring -->
  <div class="design-card">
    <div class="fab-preview">
      <button class="fab fab-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#aurora-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="aurora-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="50%" stop-color="#c084fc"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <!-- Brain / AI chip -->
          <rect x="4" y="4" width="16" height="16" rx="4" />
          <path d="M8 8h8M8 12h8M8 16h5" stroke-width="1.2" />
          <!-- Spark -->
          <circle cx="18" cy="6" r="1.5" fill="rgba(253,224,71,0.9)" stroke="none"/>
        </svg>
      </button>
    </div>
    <h3>方案四 · 极光液金</h3>
    <p class="desc">AI芯片体 + 极光旋转光环 + 暗金属<br>硬核科技，金属质感，旋转流光边框</p>
  </div>

</div>

<p style="text-align:center;margin-top:48px;color:#64748b;font-size:13px;">
  点击每个按钮可感受 hover 交互效果 &nbsp;|&nbsp; 当前线上为简单聊天气泡，以上均为升级方案
</p>

</body>
</html>
