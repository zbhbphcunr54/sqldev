<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 小助手预览 — SQLDev</title>
<style>
  /* ============================================
     Design Tokens — mirror src/styles/tokens.css
     ============================================ */
  :root {
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    --font-code: 'SF Mono', 'Fira Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;

    --color-bg: #ffffff;
    --color-panel: #ffffff;
    --color-panel-2: #f5f5f7;
    --color-panel-3: #eaeaec;
    --color-text: #1d1d1f;
    --color-text-subtle: #6e6e73;
    --color-text-muted: #aeaeb2;
    --color-brand-500: #3b82f6;
    --color-brand-600: #0071e3;
    --color-accent-bg: rgba(0, 113, 227, 0.08);
    --color-border: #d2d2d7;
    --color-overlay: rgba(0, 0, 0, 0.4);
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-2xl: 20px;
    --radius-pill: 9999px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
    --shadow-xl: 0 16px 48px rgba(0,0,0,0.12);
    --ease-apple: cubic-bezier(0.25, 0.1, 0.25, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --duration-fast: 100ms;
    --duration-normal: 200ms;
    --duration-slow: 300ms;
  }

  /* Dark theme (default for this preview) */
  [data-theme="dark"] {
    --color-bg: #0b1121;
    --color-panel: #0f172a;
    --color-panel-2: #1e293b;
    --color-panel-3: #1a2332;
    --color-text: #f1f5f9;
    --color-text-subtle: #94a3b8;
    --color-text-muted: #64748b;
    --color-brand-500: #3b82f6;
    --color-brand-600: #2563eb;
    --color-accent-bg: rgba(59, 130, 246, 0.12);
    --color-border: #1e293b;
    --color-overlay: rgba(2, 6, 23, 0.6);
  }

  /* ============================================
     Base
     ============================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--duration-slow) var(--ease-apple);
  }

  /* Theme toggle */
  .theme-bar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    gap: 8px;
  }
  .theme-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--color-border);
    cursor: pointer;
    transition: border-color var(--duration-fast);
  }
  .theme-dot.light { background: #ffffff; }
  .theme-dot.dark  { background: #0f172a; }
  .theme-dot:hover { border-color: var(--color-brand-500); }
  .theme-dot.active { border-color: var(--color-brand-500); box-shadow: 0 0 0 3px var(--color-accent-bg); }

  /* Simulated workbench background */
  .mock-workbench {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .mock-header {
    width: 100%;
    height: 48px;
    border-radius: var(--radius-md);
    background: var(--color-panel-2);
    border: 1px solid var(--color-border);
  }
  .mock-content {
    width: 100%;
    height: 320px;
    border-radius: var(--radius-md);
    background: var(--color-panel-2);
    border: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-muted);
    font-size: 14px;
  }
  .preview-hint {
    color: var(--color-text-muted);
    font-size: 13px;
    margin-top: 8px;
  }

  /* ============================================
     Floating Chat Button (FAB)
     ============================================ */
  .chat-fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 10000;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(99, 135, 241, 0.24);
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 8px 32px rgba(79, 125, 249, 0.32),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    transition:
      transform var(--duration-normal) var(--ease-spring),
      box-shadow var(--duration-normal) var(--ease-apple);
  }
  .chat-fab:hover {
    transform: scale(1.08);
    box-shadow:
      0 12px 40px rgba(79, 125, 249, 0.44),
      0 0 0 1px rgba(255, 255, 255, 0.12) inset;
  }
  .chat-fab:active { transform: scale(0.96); }

  .chat-fab svg {
    width: 22px;
    height: 22px;
    pointer-events: none;
  }

  /* Pulse dot — unread indicator */
  .chat-fab-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff3b30;
    border: 2px solid #ffffff;
    opacity: 0;
    transition: opacity var(--duration-normal);
  }
  .chat-fab-dot.visible { opacity: 1; }

  /* Tooltip label */
  .chat-fab-label {
    position: absolute;
    right: 64px;
    background: var(--color-panel);
    color: var(--color-text);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-md);
    opacity: 0;
    transform: translateX(8px);
    pointer-events: none;
    transition:
      opacity var(--duration-normal) var(--ease-apple),
      transform var(--duration-normal) var(--ease-apple);
  }
  .chat-fab:hover .chat-fab-label {
    opacity: 1;
    transform: translateX(0);
  }

  /* ============================================
     Chat Dialog Overlay
     ============================================ */
  .chat-overlay {
    position: fixed;
    inset: 0;
    z-index: 10030;
    background: var(--color-overlay);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 20px 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--duration-normal) var(--ease-apple);
  }
  .chat-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Chat panel */
  .chat-panel {
    width: min(400px, 94vw);
    height: min(560px, 72vh);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(99, 135, 241, 0.18);
    border-radius: var(--radius-xl);
    background: linear-gradient(180deg, rgba(14, 22, 40, 0.98), rgba(8, 13, 27, 0.96));
    box-shadow:
      0 24px 64px rgba(2, 6, 23, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    overflow: hidden;
    transform: translateY(20px) scale(0.96);
    transition:
      transform var(--duration-slow) var(--ease-spring),
      opacity var(--duration-normal) var(--ease-apple);
    opacity: 0;
    backdrop-filter: blur(12px);
  }
  .chat-overlay.open .chat-panel {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  /* — Header — */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(99, 135, 241, 0.1);
    flex-shrink: 0;
  }
  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-avatar {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }
  .chat-avatar svg { width: 18px; height: 18px; }
  .chat-header-info { display: flex; flex-direction: column; }
  .chat-title {
    font-size: 14px;
    font-weight: 600;
    color: #e6eefc;
  }
  .chat-subtitle {
    font-size: 11px;
    color: #7b93c0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chat-subtitle .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #34c759;
    flex-shrink: 0;
  }
  .chat-header-actions {
    display: flex;
    gap: 4px;
  }
  .chat-header-btn {
    width: 30px; height: 30px;
    border: none; border-radius: var(--radius-sm);
    background: transparent;
    color: #8b9fc9;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--duration-fast), color var(--duration-fast);
  }
  .chat-header-btn:hover { background: rgba(79, 125, 249, 0.12); color: #cddbf4; }
  .chat-header-btn svg { width: 15px; height: 15px; }

  /* — Message List — */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  /* Welcome */
  .chat-welcome {
    text-align: center;
    padding: 20px 8px;
  }
  .chat-welcome-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .chat-welcome-icon svg { width: 24px; height: 24px; color: #fff; }
  .chat-welcome h4 {
    color: #e6eefc;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .chat-welcome p {
    color: #7b93c0;
    font-size: 12px;
    line-height: 1.6;
  }
  .chat-quick-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .chat-quick-pill {
    padding: 5px 12px;
    border: 1px solid rgba(99, 135, 241, 0.18);
    border-radius: var(--radius-pill);
    background: rgba(79, 125, 249, 0.06);
    color: #b2c6e9;
    font-size: 11px;
    cursor: pointer;
    transition: all var(--duration-fast);
    white-space: nowrap;
  }
  .chat-quick-pill:hover {
    border-color: rgba(125, 163, 255, 0.36);
    background: rgba(79, 125, 249, 0.12);
    color: #e0ebff;
  }

  /* Message bubbles */
  .chat-msg {
    display: flex;
    gap: 8px;
    max-width: 90%;
    animation: msgIn 0.24s var(--ease-out);
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .chat-msg.assistant { align-self: flex-start; }
  .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .chat-msg-avatar {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .chat-msg.assistant .chat-msg-avatar {
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    color: #fff;
  }
  .chat-msg.user .chat-msg-avatar {
    background: var(--color-panel-3);
    color: var(--color-text-subtle);
  }

  .chat-msg-bubble {
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    line-height: 1.6;
    position: relative;
  }
  .chat-msg.assistant .chat-msg-bubble {
    background: rgba(79, 125, 249, 0.08);
    border: 1px solid rgba(99, 135, 241, 0.12);
    color: #dde7f8;
    border-bottom-left-radius: var(--radius-sm);
  }
  .chat-msg.user .chat-msg-bubble {
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    color: #ffffff;
    border-bottom-right-radius: var(--radius-sm);
  }
  .chat-msg-time {
    font-size: 10px;
    color: #5a6e90;
    margin-top: 3px;
    padding: 0 4px;
  }
  .chat-msg.user .chat-msg-time { text-align: right; }

  /* Typing indicator */
  .chat-typing {
    align-self: flex-start;
    display: flex;
    gap: 6px;
    padding: 12px 14px;
  }
  .chat-typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #5a7ec0;
    animation: typingBounce 1.4s infinite var(--ease-apple);
  }
  .chat-typing span:nth-child(2) { animation-delay: 0.16s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes typingBounce {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }

  /* — Input Area — */
  .chat-input-area {
    padding: 12px 16px;
    border-top: 1px solid rgba(99, 135, 241, 0.1);
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .chat-input-wrap {
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: rgba(6, 10, 22, 0.6);
    border: 1px solid rgba(99, 135, 241, 0.16);
    border-radius: var(--radius-lg);
    padding: 6px 8px;
    transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
  }
  .chat-input-wrap:focus-within {
    border-color: rgba(125, 163, 255, 0.44);
    box-shadow: 0 0 0 3px rgba(79, 125, 249, 0.1);
  }
  .chat-input {
    flex: 1;
    border: none;
    background: transparent;
    color: #edf3ff;
    font: 13px/1.5 var(--font-body);
    resize: none;
    outline: none;
    min-height: 22px;
    max-height: 120px;
    padding: 2px 4px;
  }
  .chat-input::placeholder { color: #54688a; }
  .chat-input::-webkit-scrollbar { width: 4px; }
  .chat-input::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

  .chat-send-btn {
    width: 34px; height: 34px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f7df9, #8b5cf6);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform var(--duration-fast), box-shadow var(--duration-fast), opacity var(--duration-fast);
  }
  .chat-send-btn:hover {
    transform: scale(1.07);
    box-shadow: 0 4px 14px rgba(79, 125, 249, 0.36);
  }
  .chat-send-btn:active { transform: scale(0.94); }
  .chat-send-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .chat-send-btn svg { width: 16px; height: 16px; }

  .chat-quota {
    font-size: 10px;
    color: #54688a;
    text-align: center;
    padding: 0 16px 8px;
  }

  /* ============================================
     Light Theme Overrides for Chat
     ============================================ */
  [data-theme="light"] .chat-fab {
    border-color: rgba(148, 163, 184, 0.32);
    box-shadow:
      0 8px 28px rgba(37, 99, 235, 0.16),
      0 0 0 1px rgba(255, 255, 255, 0.7) inset;
  }
  [data-theme="light"] .chat-overlay {
    background: rgba(148, 163, 184, 0.28);
  }
  [data-theme="light"] .chat-panel {
    border-color: #dbe5f5;
    background: linear-gradient(180deg, #ffffff, #f8fafc);
    box-shadow: 0 20px 54px rgba(15, 23, 42, 0.16);
  }
  [data-theme="light"] .chat-header {
    border-bottom-color: #e8edf5;
  }
  [data-theme="light"] .chat-title { color: #0f172a; }
  [data-theme="light"] .chat-subtitle { color: #64748b; }
  [data-theme="light"] .chat-header-btn { color: #94a3b8; }
  [data-theme="light"] .chat-header-btn:hover { background: rgba(37, 99, 235, 0.06); color: #475569; }
  [data-theme="light"] .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); }
  [data-theme="light"] .chat-welcome h4 { color: #0f172a; }
  [data-theme="light"] .chat-welcome p { color: #64748b; }
  [data-theme="light"] .chat-quick-pill {
    border-color: #dbe5f5;
    background: #f8fafc;
    color: #475569;
  }
  [data-theme="light"] .chat-quick-pill:hover {
    border-color: rgba(37, 99, 235, 0.22);
    background: rgba(37, 99, 235, 0.04);
    color: #1d4ed8;
  }
  [data-theme="light"] .chat-msg.assistant .chat-msg-bubble {
    background: #f0f4ff;
    border-color: #dbe5f5;
    color: #1e293b;
  }
  [data-theme="light"] .chat-msg.user .chat-msg-avatar {
    background: #e2e8f0;
  }
  [data-theme="light"] .chat-input-area { border-top-color: #e8edf5; }
  [data-theme="light"] .chat-input-wrap {
    background: #ffffff;
    border-color: #dbe5f5;
  }
  [data-theme="light"] .chat-input {
    color: #0f172a;
  }
  [data-theme="light"] .chat-input::placeholder { color: #94a3b8; }
  [data-theme="light"] .chat-quota { color: #94a3b8; }
  [data-theme="light"] .chat-msg-time { color: #94a3b8; }
  [data-theme="light"] .chat-typing span { background: #93a3c0; }

  /* Mobile responsive */
  @media (max-width: 480px) {
    .chat-panel {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      max-height: none;
    }
    .chat-overlay { padding: 0; }
    .chat-fab { right: 16px; bottom: 16px; width: 46px; height: 46px; }
    .chat-fab svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<!-- Theme Toggle -->
<div class="theme-bar">
  <button class="theme-dot light active" onclick="setTheme('light')" title="浅色模式"></button>
  <button class="theme-dot dark" onclick="setTheme('dark')" title="深色模式"></button>
</div>

<!-- Mock workbench background -->
<div class="mock-workbench">
  <div class="mock-header"></div>
  <div class="mock-content">SQLDev 工作台 (模拟背景)</div>
  <p class="preview-hint">点击右下角悬浮按钮打开 AI 小助手 ↓</p>
</div>

<!-- ============================================
     Floating Chat Button
     ============================================ -->
<button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="AI 小助手">
  <!-- Chat bubble icon -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <path d="M8 9h8" stroke-width="1.4"/>
    <path d="M8 13h5" stroke-width="1.4"/>
  </svg>
  <span class="chat-fab-dot" id="chatFabDot"></span>
  <span class="chat-fab-label">AI 小助手</span>
</button>

<!-- ============================================
     Chat Dialog Overlay
     ============================================ -->
<div class="chat-overlay" id="chatOverlay" role="presentation" onclick="closeChatOnMask(event)">
  <section class="chat-panel" role="dialog" aria-modal="true" aria-label="AI 小助手对话框" onclick="event.stopPropagation()">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
            <path d="M20 14c0-4.4-3.6-8-8-8s-8 3.6-8 8v4h16v-4z"/>
            <circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="chat-header-info">
          <span class="chat-title">SQLDev AI 助手</span>
          <span class="chat-subtitle">
            <span class="status-dot"></span>
            在线 · 今日剩余 18/20 次
          </span>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="chat-header-btn" title="新对话" onclick="newChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button class="chat-header-btn" title="关闭" onclick="toggleChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <!-- Welcome state -->
      <div class="chat-welcome" id="chatWelcome">
        <div class="chat-welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
        </div>
        <h4>你好，我是 SQLDev AI 助手</h4>
        <p>我可以帮你写 SQL、解释执行计划、优化查询、<br>排查数据库问题，或者聊聊数据库设计。</p>
        <div class="chat-quick-prompts">
          <button class="chat-quick-pill" onclick="sendQuick('帮我写一个查询用户活跃度的 SQL')">📊 查询用户活跃度</button>
          <button class="chat-quick-pill" onclick="sendQuick('解释一下 EXPLAIN 的输出')">🔍 解释执行计划</button>
          <button class="chat-quick-pill" onclick="sendQuick('如何优化慢查询？')">⚡ 优化慢查询</button>
          <button class="chat-quick-pill" onclick="sendQuick('设计一个订单表的索引策略')">🗂 索引策略</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea
          class="chat-input"
          id="chatInput"
          rows="1"
          placeholder="输入你的问题..."
          onkeydown="handleInputKey(event)"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <button class="chat-send-btn" id="chatSendBtn" disabled onclick="sendMessage()" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p class="chat-quota">由 DeepSeek / Claude 驱动 · 每日限额 20 次</p>

  </section>
</div>

<script>
  // ============================================
  // Theme toggle
  // ============================================
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    document.querySelector(`.theme-dot.${theme}`).classList.add('active');
    localStorage.setItem('preview-theme', theme);
  }
  // Init theme from localStorage
  (function() {
    var saved = localStorage.getItem('preview-theme') || 'dark';
    setTheme(saved);
  })();

  // ============================================
  // Chat toggle
  // ============================================
  var chatOpen = false;
  function toggleChat() {
    chatOpen = !chatOpen;
    var overlay = document.getElementById('chatOverlay');
    if (chatOpen) {
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(function() {
        document.getElementById('chatInput').focus();
      }, 300);
    } else {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  }
  function closeChatOnMask(e) {
    if (e.target === e.currentTarget) toggleChat();
  }

  // ============================================
  // Message rendering
  // ============================================
  var msgId = 0;
  function addMessage(role, text) {
    var container = document.getElementById('chatMessages');
    // Hide welcome on first message
    var welcome = document.getElementById('chatWelcome');
    if (welcome) welcome.style.display = 'none';

    var now = new Date();
    var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    var html = '';
    html += '<div class="chat-msg ' + role + '">';
    html += '<div class="chat-msg-avatar">' + (role === 'assistant' ?
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' :
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + '</div>';
    html += '<div>';
    html += '<div class="chat-msg-bubble">' + text + '</div>';
    html += '<div class="chat-msg-time">' + time + '</div>';
    html += '</div></div>';
    container.insertAdjacentHTML('beforeend', html);
    container.scrollTop = container.scrollHeight;
    return html;
  }

  function showTyping() {
    var container = document.getElementById('chatMessages');
    var html = '<div class="chat-typing" id="typingIndicator"><span></span><span></span><span></span></div>';
    container.insertAdjacentHTML('beforeend', html);
    container.scrollTop = container.scrollHeight;
  }

  function hideTyping() {
    var el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  // ============================================
  // Send message
  // ============================================
  function sendMessage() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;
    addMessage('user', escapeHtml(text));
    input.value = '';
    autoResize(input);
    updateSendBtn();

    // Simulate AI reply
    showTyping();
    setTimeout(function() {
      hideTyping();
      var reply = getMockReply(text);
      addMessage('assistant', reply);
    }, 1200 + Math.random() * 800);
  }

  function sendQuick(text) {
    document.getElementById('chatInput').value = text;
    sendMessage();
  }

  function handleInputKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function updateSendBtn() {
    var btn = document.getElementById('chatSendBtn');
    var input = document.getElementById('chatInput');
    btn.disabled = !input.value.trim();
  }

  function newChat() {
    var container = document.getElementById('chatMessages');
    container.innerHTML = '';
    var html = '';
    html += '<div class="chat-welcome" id="chatWelcome">';
    html += '<div class="chat-welcome-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></div>';
    html += '<h4>你好，我是 SQLDev AI 助手</h4>';
    html += '<p>我可以帮你写 SQL、解释执行计划、优化查询、<br>排查数据库问题，或者聊聊数据库设计。</p>';
    html += '<div class="chat-quick-prompts">';
    html += '<button class="chat-quick-pill" onclick="sendQuick(\'帮我写一个查询用户活跃度的 SQL\')">📊 查询用户活跃度</button>';
    html += '<button class="chat-quick-pill" onclick="sendQuick(\'解释一下 EXPLAIN 的输出\')">🔍 解释执行计划</button>';
    html += '<button class="chat-quick-pill" onclick="sendQuick(\'如何优化慢查询？\')">⚡ 优化慢查询</button>';
    html += '<button class="chat-quick-pill" onclick="sendQuick(\'设计一个订单表的索引策略\')">🗂 索引策略</button>';
    html += '</div></div>';
    container.innerHTML = html;
  }

  // Input watch
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('chatInput').addEventListener('input', updateSendBtn);
  });

  // Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && chatOpen) toggleChat();
  });

  // ============================================
  // Mock AI replies
  // ============================================
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function getMockReply(input) {
    var lower = input.toLowerCase();
    if (lower.includes('活跃') || lower.includes('查询')) {
      return '可以这样查询用户活跃度：<br><br><code style="background:rgba(79,125,249,0.1);padding:2px 6px;border-radius:4px;font-size:12px">SELECT user_id, COUNT(*) AS actions,<br>  MAX(created_at) AS last_active<br>FROM user_actions<br>WHERE created_at >= NOW() - INTERVAL \'30 days\'<br>GROUP BY user_id<br>ORDER BY actions DESC;</code><br><br>建议在 <code>user_actions(created_at, user_id)</code> 上建复合索引。需要我详细解释吗？';
    }
    if (lower.includes('explain') || lower.includes('执行计划')) {
      return '<b>EXPLAIN</b> 输出从内向外、从上到下阅读：<br><br>🔹 <b>Seq Scan</b> — 全表扫描，大数据量时是瓶颈<br>🔹 <b>Index Scan</b> — 走索引，但可能回表<br>🔹 <b>Index Only Scan</b> — 覆盖索引，最快<br>🔹 <b>Nested Loop</b> — 小表驱动大表时高效<br>🔹 <b>Hash Join</b> — 大表 join 常用<br><br>关键看 <code>rows</code> 估算和 <code>actual time</code> 的差距，差距大说明统计信息过时。';
    }
    if (lower.includes('慢查询') || lower.includes('优化')) {
      return '优化慢查询的几个方向：<br><br>1️⃣ <b>检查索引</b> — WHERE / JOIN / ORDER BY 列是否有索引<br>2️⃣ <b>避免 SELECT *</b> — 只取需要的列，利用覆盖索引<br>3️⃣ <b>拆分大查询</b> — 复杂 JOIN 考虑分步查询或用临时表<br>4️⃣ <b>检查锁竞争</b> — 查看 pg_locks / information_schema<br>5️⃣ <b>EXPLAIN ANALYZE</b> — 实际执行看瓶颈在哪<br><br>你目前有遇到具体的慢查询吗？发给我看看。';
    }
    if (lower.includes('索引')) {
      return '订单表索引策略建议：<br><br><b>主键索引</b>：<code>id</code> (已有)<br><b>查询索引</b>：<code>user_id + status + created_at DESC</code>（用户查自己的订单）<br><b>管理后台</b>：<code>status + created_at</code>（运营按状态筛选）<br><b>唯一索引</b>：<code>order_no</code>（订单号防重）<br><br>⚠️ 不要过度索引 — 每个索引都会拖慢写入。一般单表控制在 5-8 个索引以内。';
    }
    return '好的，我理解了你的问题。这是一个典型的数据库场景，让我帮你分析一下：<br><br>建议从<b>索引优化</b>和<b>查询重写</b>两个方向入手。可以给我更多上下文吗？比如表结构、数据量、当前的查询 SQL？';
  }
</script>
</body>
</html>
